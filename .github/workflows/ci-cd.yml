name: Build and Release

on:
  push:
    tags:
    - 'v*'


jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            asset_name: github-discussion-tracker-linux
            path: github-discussion-tracker-linux
          - os: windows-latest
            asset_name: github-discussion-tracker-windows.exe
            path: github-discussion-tracker-windows.exe
          - os: macos-latest
            asset_name: github-discussion-tracker-darwin
            path: github-discussion-tracker-darwin

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.26'

    - name: Build Project
      run: |
        echo "Building for ${{ matrix.os }}"
        go build -o ${{ matrix.path }}

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: compiled-${{ matrix.os }}
        path: ${{ matrix.path }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/compiled-ubuntu-latest/*
            artifacts/compiled-windows-latest/*
            artifacts/compiled-macos-latest/*

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
